name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: jdx/mise-action@v4

      - name: Test grammar
        run: mise run check

      - name: Test agent-evaluation scorer
        run: mise run eval:check
